<div class="app">
  <main class="card">

    <p class="status">
      {{ isDrawing ? 'DRAWING...' : 'YOUR TOPIC' }}
    </p>

    <h1>{{ currentTopic.title }}</h1>

    @if (!isDrawing) {
      <div class="translations">
        <div>{{ currentTopic.es }}</div>
        <div>{{ currentTopic.pt }}</div>
      </div>
    }

    <button
      type="button"
      (click)="spinTopic()"
      [disabled]="isDrawing"
    >
      {{ isDrawing ? 'Drawing...' : 'Spin topic' }}
    </button>

  </main>
</div>
